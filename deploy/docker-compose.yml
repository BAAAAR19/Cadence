# Gateway + OTel collector + Prometheus + Grafana.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:3000   (anonymous admin; the Cadence dashboard is provisioned)
#
# The model is mounted from ./models rather than baked into the image: a 500 MB
# layer in a demo image is a tax on everyone who clones the repo.
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro
    environment:
      CADENCE_HOST: 0.0.0.0
      CADENCE_PORT: "8000"
      CADENCE_CONFIG_NAME: "continuous+cache"
      CADENCE_SCHEDULER: continuous
      CADENCE_BACKEND: llamacpp
      CADENCE_MODEL_PATH: /app/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      CADENCE_N_CTX: "8192"
      CADENCE_MAX_BATCH: "16"
      CADENCE_MAX_PREFILL_TOKENS: "512"
      CADENCE_ENABLE_PAGED_KV: "true"
      CADENCE_ENABLE_PREFIX_CACHE: "true"
      CADENCE_TRACING_ENABLED: "true"
      CADENCE_OTLP_ENDPOINT: http://otel-collector:4317
      CADENCE_SLO_S: "2.0"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 1s is far below Prometheus's usual advice and deliberate: a load run is
      # 2-5 minutes and a 15s scrape would render four points on the chart.
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
