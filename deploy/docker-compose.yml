# Gateway + OTel collector + Prometheus + Grafana.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:3000   (anonymous admin; the Cadence dashboard is provisioned)
#
# The image bakes the weights (deploy/Dockerfile fetches and checksums the
# GGUF at build time, because a model pulled on boot is a cold start that
# scales with the network). ./models is still mounted over it here: if you
# already have the file, the mount means the build does not spend five
# minutes downloading a copy you have, and it is also how a locally refitted
# admission artifact reaches the container.
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro
    environment:
      CADENCE_HOST: 0.0.0.0
      CADENCE_PORT: "8000"
      CADENCE_CONFIG_NAME: "continuous+cache"
      CADENCE_SCHEDULER: continuous
      CADENCE_BACKEND: llamacpp
      CADENCE_MODEL_PATH: /app/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      CADENCE_N_CTX: "8192"
      CADENCE_MAX_BATCH: "16"
      CADENCE_MAX_PREFILL_TOKENS: "512"
      CADENCE_ENABLE_PAGED_KV: "true"
      CADENCE_ENABLE_PREFIX_CACHE: "true"
      CADENCE_TRACING_ENABLED: "true"
      CADENCE_OTLP_ENDPOINT: http://otel-collector:4317
      CADENCE_SLO_S: "2.0"
      # See deploy/fly.toml for why admission stays off outside the machine
      # its predictor was calibrated on. The gateway warns at start-up if it
      # is turned on with a mismatched artifact.
      CADENCE_ADMISSION: "none"
      CADENCE_MAX_CONCURRENT_REQUESTS: "256"
      CADENCE_DRAIN_GRACE_S: "90"
    depends_on:
      - otel-collector
    # Readiness, not liveness: compose should call this container healthy only
    # once the model is loaded and the engine has warmed up, which is what
    # /ready answers. /health is 200 within a second of start and would mark
    # it healthy roughly half a minute too early.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    # The drain in cadence/api/app.py needs the signal and needs the time.
    stop_signal: SIGTERM
    stop_grace_period: 95s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 1s is far below Prometheus's usual advice and deliberate: a load run is
      # 2-5 minutes and a 15s scrape would render four points on the chart.
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
