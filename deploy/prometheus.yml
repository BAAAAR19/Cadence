global:
  # A load run is minutes long, so the default 15s scrape would draw a handful
  # of points. 1s costs nothing at this cardinality.
  scrape_interval: 1s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cadence
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          instance: gateway
